name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent signing key
        shell: bash
        env:
          SHIJU_KEYSTORE_BASE64: ${{ secrets.SHIJU_KEYSTORE_BASE64 }}
          SHIJU_KEYSTORE_PASSWORD: ${{ secrets.SHIJU_KEYSTORE_PASSWORD }}
          SHIJU_KEY_ALIAS: ${{ secrets.SHIJU_KEY_ALIAS }}
          SHIJU_KEY_PASSWORD: ${{ secrets.SHIJU_KEY_PASSWORD }}
        run: |
          for value in SHIJU_KEYSTORE_BASE64 SHIJU_KEYSTORE_PASSWORD SHIJU_KEY_ALIAS SHIJU_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing GitHub Actions secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$SHIJU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiju-release.jks"

      - name: Build signed upgradeable APK
        shell: bash
        env:
          SHIJU_KEYSTORE_FILE: ${{ runner.temp }}/shiju-release.jks
          SHIJU_KEYSTORE_PASSWORD: ${{ secrets.SHIJU_KEYSTORE_PASSWORD }}
          SHIJU_KEY_ALIAS: ${{ secrets.SHIJU_KEY_ALIAS }}
          SHIJU_KEY_PASSWORD: ${{ secrets.SHIJU_KEY_PASSWORD }}
        run: |
          project_dir="."
          if [ -f "android-package-experiment/gradlew" ]; then
            project_dir="android-package-experiment"
          fi
          chmod +x "$project_dir/gradlew"
          "$project_dir/gradlew" -p "$project_dir" --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            "$project_dir/app/build/outputs/apk/release/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiju-android-release-${{ github.run_number }}
          path: |
            android-package-experiment/app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
